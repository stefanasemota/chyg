[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-hygiene"
version = "1.0.0"
description = "Zero-dependency macOS CLI/TUI to audit AI coding agent instruction files."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Stephan Asemota", email = "stefan@asemota.ch" },
]
keywords = ["cli", "tui", "macos", "ai-agents", "context-hygiene", "python"]
dependencies = []

[project.urls]
Homepage = "https://github.com/stefanasemota/chyg"
Repository = "https://github.com/stefanasemota/chyg"

[project.scripts]
chyg = "context_hygiene.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
